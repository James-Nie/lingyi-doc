<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />

  <!-- 基础 SEO -->
  <title>零一文档 — 智能云文档与协同办公平台</title>
  <meta name="description" content="零一文档是一站式智能云文档平台，提供在线文档、普通表格、多维表格、思维导图等全场景创作与团队协作，支持私有化部署与信创适配。" />
  <meta name="keywords" content="零一文档,云文档,在线文档,协同办公,在线表格,Excel在线,多维表格,思维导图,知识库,私有化部署,信创适配" />
  <meta name="author" content="零一文档" />
  <meta name="robots" content="index, follow, max-image-preview:large" />
  <meta name="googlebot" content="index, follow" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="format-detection" content="telephone=no, email=no" />
  <meta name="theme-color" content="#1a73e8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="apple-touch-icon" href="/logo.png" />
  <meta name="application-name" content="零一文档" />
  <meta name="apple-mobile-web-app-title" content="零一文档" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />

  <!-- Canonical / 站点 URL：生产构建时设置环境变量 VITE_SITE_URL（勿带末尾斜杠） -->
  <link rel="canonical" href="%VITE_SITE_URL%/" />

  <!-- Open Graph（微信 / 钉钉 / Facebook 等分享） -->
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="zh_CN" />
  <meta property="og:site_name" content="零一文档" />
  <meta property="og:title" content="零一文档 — 让知识与协作更高效" />
  <meta property="og:description" content="覆盖文档、表格、多维表、思维导图等全场景创作，满足个人、团队与企业级知识管理需求，支持私有化部署。" />
  <meta property="og:url" content="%VITE_SITE_URL%/" />
  <meta property="og:image" content="%VITE_SITE_URL%/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="零一文档 — 智能云文档与协同办公平台" />

  <!-- Twitter / X Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="零一文档 — 让知识与协作更高效" />
  <meta name="twitter:description" content="一站式智能云文档平台，在线文档、表格、多维表、思维导图，支持私有化部署与信创适配。" />
  <meta name="twitter:image" content="%VITE_SITE_URL%/og-cover.png" />
  <meta name="twitter:image:alt" content="零一文档 — 智能云文档与协同办公平台" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body, #root, #root > .sheet-antd-root {
      width: 100%;
      height: 100%;
      min-height: 0;
      overflow: hidden;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>

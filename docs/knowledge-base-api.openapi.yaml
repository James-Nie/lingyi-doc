openapi: 3.0.3
info:
  title: 零一文档 - 知识库 API
  version: 1.0.0
  description: |
    C 端知识库（Wiki）模块 API 草案。

    **租户隔离**
    - 所有接口需 `Authorization: Bearer <JWT>`
    - `scope` / `tenant_id` 从 JWT 推导，客户端 Body 不得传入
    - 企业身份需通过 `TenantContextGuard` 成员校验
    - 跨租户或无权限访问统一返回 `404`

    **响应包装**
    - 成功：`{ "code": 0, "data": <T> }`
    - 失败：`{ "code": <业务码>, "message": "<说明>" }`

servers:
  - url: /api/v1/c
    description: C 端 Consumer API

tags:
  - name: KnowledgeBase
    description: 知识库 CRUD
  - name: KbNode
    description: 目录节点
  - name: KbMember
    description: 成员管理

security:
  - bearerAuth: []

paths:
  /knowledge-bases:
    get:
      tags: [KnowledgeBase]
      summary: 获取知识库列表
      operationId: listKnowledgeBases
      parameters:
        - $ref: '#/components/parameters/SortByUpdated'
        - $ref: '#/components/parameters/Keyword'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBaseListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [KnowledgeBase]
      summary: 创建知识库
      operationId: createKnowledgeBase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeBaseRequest'
      responses:
        '200':
          description: 成功（含默认首页节点）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateKnowledgeBaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /knowledge-bases/{kbId}:
    parameters:
      - $ref: '#/components/parameters/KbId'
    get:
      tags: [KnowledgeBase]
      summary: 获取知识库详情
      operationId: getKnowledgeBase
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBase'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [KnowledgeBase]
      summary: 更新知识库元数据
      operationId: updateKnowledgeBase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKnowledgeBaseRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KnowledgeBase'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [KnowledgeBase]
      summary: 软删除知识库
      description: 级联软删目录节点，不删除引用的文档
      operationId: deleteKnowledgeBase
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge-bases/{kbId}/nodes:
    parameters:
      - $ref: '#/components/parameters/KbId'
    get:
      tags: [KbNode]
      summary: 获取目录节点列表
      description: 返回扁平列表，前端可按 parentId 组装树
      operationId: listKbNodes
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbNodeListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [KbNode]
      summary: 新增目录节点
      operationId: createKbNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKbNodeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge-bases/{kbId}/nodes/{nodeId}:
    parameters:
      - $ref: '#/components/parameters/KbId'
      - $ref: '#/components/parameters/NodeId'
    patch:
      tags: [KbNode]
      summary: 更新节点（重命名 / 移动 / 排序）
      operationId: updateKbNode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKbNodeRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbNode'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [KbNode]
      summary: 删除目录节点
      operationId: deleteKbNode
      parameters:
        - name: deleteDocument
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: doc_ref 节点是否同时删除关联文档（移入回收站）
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge-bases/{kbId}/nodes/{parentNodeId}/doc:
    parameters:
      - $ref: '#/components/parameters/KbId'
      - name: parentNodeId
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: 父节点 ID（可为首页节点）
    post:
      tags: [KbNode]
      summary: 在目录下创建文档并挂载节点
      description: |
        服务端事务：
        1. 校验 KB 写权限
        2. 创建 documents（scope/tenant_id 从 JWT）
        3. 创建 kb_nodes（node_type=doc_ref）
      operationId: createKbDocument
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKbDocumentRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/CreateKbDocumentResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge-bases/{kbId}/members:
    parameters:
      - $ref: '#/components/parameters/KbId'
    get:
      tags: [KbMember]
      summary: 获取成员列表
      operationId: listKbMembers
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbMemberListResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [KbMember]
      summary: 添加成员
      operationId: addKbMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddKbMemberRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/KbMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /knowledge-bases/{kbId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/KbId'
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      tags: [KbMember]
      summary: 移除成员
      operationId: removeKbMember
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiSuccess'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                            format: uuid
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    KbId:
      name: kbId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NodeId:
      name: nodeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SortByUpdated:
      name: sortBy
      in: query
      required: false
      schema:
        type: string
        enum: [updated, created, name]
        default: updated
    Keyword:
      name: keyword
      in: query
      required: false
      schema:
        type: string
        maxLength: 200

  responses:
    Unauthorized:
      description: 未登录或 Token 无效
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BadRequest:
      description: 参数错误或业务约束冲突（如跨 scope 引用文档）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: 资源不存在或无权限（跨租户统一 404）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:
    ApiSuccess:
      type: object
      required: [code, data]
      properties:
        code:
          type: integer
          example: 0
        data:
          nullable: true

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          example: 100005
        message:
          type: string
          example: 资源不存在

    KnowledgeBaseScope:
      type: integer
      enum: [1, 2]
      description: '1=个人 2=企业'

    KnowledgeBaseVisibility:
      type: string
      enum: [members, organization]

    KnowledgeBaseCover:
      type: string
      enum: [blue, sunset]

    KbNodeType:
      type: string
      enum: [page, doc_ref, folder]

    KbMemberRole:
      type: string
      enum: [owner, admin, editor, viewer]

    DocType:
      type: string
      enum: [freeform, base, richtext, mindnote, slides, standard]
      description: 与 documents.doc_type 对齐

    KnowledgeBase:
      type: object
      required:
        - id
        - scope
        - name
        - visibility
        - cover
        - createdBy
        - updatedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/KnowledgeBaseScope'
        ownerId:
          type: string
          format: uuid
          nullable: true
        tenantId:
          type: string
          format: uuid
          nullable: true
        orgId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          maxLength: 200
        description:
          type: string
          nullable: true
        emoji:
          type: string
          maxLength: 16
        cover:
          $ref: '#/components/schemas/KnowledgeBaseCover'
        visibility:
          $ref: '#/components/schemas/KnowledgeBaseVisibility'
        myRole:
          $ref: '#/components/schemas/KbMemberRole'
          description: 当前用户在 members 知识库中的角色；organization 公开库可能为 viewer
        createdBy:
          type: string
          format: uuid
        updatedBy:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KbNode:
      type: object
      required:
        - id
        - kbId
        - title
        - nodeType
        - sortOrder
        - isHome
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        kbId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        title:
          type: string
          maxLength: 500
        nodeType:
          $ref: '#/components/schemas/KbNodeType'
        docId:
          type: string
          nullable: true
          description: nodeType=doc_ref 时存在
        docType:
          $ref: '#/components/schemas/DocType'
          nullable: true
          description: 关联文档类型，便于侧栏图标渲染
        sortOrder:
          type: integer
        isHome:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    KbMember:
      type: object
      required: [id, kbId, userId, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        kbId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/KbMemberRole'
        createdAt:
          type: string
          format: date-time

    KnowledgeBaseListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeBase'
        total:
          type: integer

    KbNodeListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KbNode'
        total:
          type: integer

    KbMemberListResponse:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KbMember'
        total:
          type: integer

    CreateKnowledgeBaseRequest:
      type: object
      required: [name, visibility]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        emoji:
          type: string
          maxLength: 16
        cover:
          $ref: '#/components/schemas/KnowledgeBaseCover'
        visibility:
          $ref: '#/components/schemas/KnowledgeBaseVisibility'
        orgId:
          type: string
          format: uuid
          description: 可选组织归属（须属于当前 tenant）

    CreateKnowledgeBaseResponse:
      allOf:
        - $ref: '#/components/schemas/KnowledgeBase'
        - type: object
          required: [defaultNodeId]
          properties:
            defaultNodeId:
              type: string
              format: uuid
              description: 自动创建的首页节点 ID

    UpdateKnowledgeBaseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
        emoji:
          type: string
          maxLength: 16
        cover:
          $ref: '#/components/schemas/KnowledgeBaseCover'
        visibility:
          $ref: '#/components/schemas/KnowledgeBaseVisibility'
        orgId:
          type: string
          format: uuid
          nullable: true

    CreateKbNodeRequest:
      type: object
      required: [title, nodeType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        nodeType:
          $ref: '#/components/schemas/KbNodeType'
        parentId:
          type: string
          format: uuid
          nullable: true
        docId:
          type: string
          description: nodeType=doc_ref 时必填；须与 KB 同 scope
        sortOrder:
          type: integer

    UpdateKbNodeRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        parentId:
          type: string
          format: uuid
          nullable: true
        sortOrder:
          type: integer

    CreateKbDocumentRequest:
      type: object
      required: [title, docType]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 500
        docType:
          $ref: '#/components/schemas/DocType'
        templateId:
          type: string
          nullable: true
          description: 可选模板 ID

    CreateKbDocumentResponse:
      type: object
      required: [docId, nodeId, docType, title]
      properties:
        docId:
          type: string
        nodeId:
          type: string
          format: uuid
        docType:
          $ref: '#/components/schemas/DocType'
        title:
          type: string

    AddKbMemberRequest:
      type: object
      required: [userId, role]
      properties:
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/KbMemberRole'

openapi: 3.0.3
info:
  title: 文档分享 API
  version: 1.0.0
  description: 对标飞书/语雀文档分享能力，C 端鉴权 + 公开访客链路

servers:
  - url: /api/v1

paths:
  /c/docs/shared-with-me:
    get:
      summary: 与我共享的文档列表
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [lastVisited, created, updated]
      responses:
        '200':
          description: OK

  /c/docs/{docId}/share:
    get:
      summary: 获取文档分享配置
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocShareConfig'
    put:
      summary: 创建或更新公开链接分享
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertDocShareInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DocShareConfig'

  /c/docs/{docId}/share/close:
    post:
      summary: 关闭分享
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK

  /c/docs/{docId}/share/collaborators:
    get:
      summary: 列出协作者
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
    post:
      summary: 添加协作者
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDocShareCollaboratorInput'
      responses:
        '200':
          description: OK

  /c/docs/{docId}/share/collaborators/{userId}:
    delete:
      summary: 移除协作者
      tags: [Share]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: docId
          in: path
          required: true
          schema: { type: string }
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK

  /share/{token}:
    get:
      summary: 公开分享信息（无需登录）
      tags: [SharePublic]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShareInfo'

  /share/{token}/verify:
    post:
      summary: 验证密码并获取文档预览
      tags: [SharePublic]
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicShareDocument'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    DocSharePermissionLevel:
      type: string
      enum: [none, read, comment, edit, manage]

    DocShareConfig:
      type: object
      properties:
        docId: { type: string }
        shareToken: { type: string }
        shareUrl: { type: string }
        status: { type: string, enum: [active, closed] }
        permissionLevel:
          $ref: '#/components/schemas/DocSharePermissionLevel'
        expireTime: { type: string, format: date-time, nullable: true }
        hasPassword: { type: boolean }
        allowDownload: { type: boolean }
        allowPrint: { type: boolean }
        allowCopy: { type: boolean }
        allowReshare: { type: boolean }
        watermarkEnabled: { type: boolean }

    UpsertDocShareInput:
      type: object
      required: [permissionLevel]
      properties:
        permissionLevel:
          $ref: '#/components/schemas/DocSharePermissionLevel'
        expireTime: { type: string, format: date-time, nullable: true }
        password: { type: string, nullable: true }
        clearPassword: { type: boolean }
        allowDownload: { type: boolean }
        allowPrint: { type: boolean }
        allowCopy: { type: boolean }
        allowReshare: { type: boolean }
        watermarkEnabled: { type: boolean }

    AddDocShareCollaboratorInput:
      type: object
      required: [userId, permissionLevel]
      properties:
        userId: { type: string }
        permissionLevel:
          $ref: '#/components/schemas/DocSharePermissionLevel'

    PublicShareInfo:
      type: object
      properties:
        title: { type: string }
        docType: { type: string }
        permissionLevel:
          $ref: '#/components/schemas/DocSharePermissionLevel'
        requirePassword: { type: boolean }
        expired: { type: boolean }

    PublicShareDocument:
      type: object
      properties:
        title: { type: string }
        docType: { type: string }
        permissionLevel:
          $ref: '#/components/schemas/DocSharePermissionLevel'
        data: {}
